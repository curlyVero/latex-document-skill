name: Build fixed report docs
on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install python-docx
      - run: python tmp_build_report_docs2.py
      - uses: actions/upload-artifact@v4
        with:
          name: fixed-report-docs
          path: output/*.docx
          retention-days: 1
