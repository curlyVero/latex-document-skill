name: Publish individual report docs
on:
  pull_request:
    branches: [ main ]
permissions:
  contents: write
jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install python-docx
      - run: python tmp_build_report_docs2.py
      - name: Commit individual Word files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/*.docx
          git commit -m "Publish individual Word files [skip ci]" || exit 0
          git push origin HEAD:${{ github.head_ref }}
